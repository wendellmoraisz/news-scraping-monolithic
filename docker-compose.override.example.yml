services:
  newsscrapingdb:
    container_name: newsscrapingdb
    restart: always
    environment:
      MYSQL_DATABASE: "NewsScraping"
      MYSQL_ROOT_PASSWORD: "your_mysql_root_password"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  
  newsscrapingmonolithic.api:
    container_name: newsscrapingmonolithic.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__NewsScrapingDbConfig=server=newsscrapingdb;port=3306;database=NewsScraping;user=root;password=your_mysql_root_password"
      - "EmailServiceCredentials__SenderEmail=your_email@domain.com"
      - "EmailServiceCredentials__SenderName=your_sender_name"
      - "EmailServiceCredentials__BrevoApiKey=your_api_key"
    depends_on:
      newsscrapingdb:
        condition: service_healthy
    ports:
      - "8000:80"